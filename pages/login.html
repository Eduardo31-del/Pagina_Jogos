<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamer Voucher</title>
    <link rel="stylesheet" href="../stiles/login.css">
    <link rel="stylesheet" href="../stiles/home.css">
</head>
<body class="login">
    <header class="menu">
        <nav class="nav-menu">
            <div class="area-logo"><img src="../img/transferir.gif" alt="" id="logo"></div>
            <div>
                <h1 class="titulo-site">Gamer Vouncher</h1>
            </div>
 
            <ul class="nav-list">
                <li class="nav-item"><a href="home.html" class="nav-link">Home</a></li>
                <li class="nav-item"><a href="produto.html" class="nav-link">Produtos</a></li>
                <li class="nav-item"><a href="cadastro.html" class="nav-link">Cadastro</a></li>
                <li class="nav-item"><a href="login.html" class="nav-link">Login</a></li>
               
            </ul>
        </nav>
    </header>
    <main class="tela-login">
        <div class="container">
            <div class="container-login">
                <img src="../images/sonicdance1.gif" alt="" id="img-form">
            </div>
            <div class="wrap-login">
                <form action="#" class="login-form">
                    <span class="login-form-title">Login</span>
                     <div class="wrap-input">
                        <input type="email" name="email" class="input-form">
                        <span class="focus-input-form" data-placeholder="E-mail"></span>
                    </div>
                    <div class="wrap-input margin-bottom-35">
                        <input type="password" name="senha" class="input-form">
                        <span class="focus-input-form" data-placeholder="Senha"></span>
                    </div>
                    <div class="container-login-form-btn">
                        <button class="login-form-btn">Logar</button>
                    </div>
                    <ul class="login-utils">
                        <li class="margin-botton-8 margin-top-8">
                            <span class="texto1">Esqueceu sua </span>
                            <a href="#" class="texto2">Senha?</a>
                        </li>
                        <a href="cadastro..html" class="texto2">Cadastre-se</a>
                    </ul>
                </form>
            </div>
        </div>
    </main>
</body>
